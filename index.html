<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kathmandu Hiking Route Finder</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* fallback in case you didn't separate CSS */
    </style>
</head>

<body>

<div class="container">

    <h1>🏔 Kathmandu Hiking Route Finder</h1>
    <p>Welcome to your hiking guide!!</p>
    <p>Navigate and find your shortest path</p>
    <p>Do remember us before venturing for your next hike</p>

    <label for="start">Starting Location</label>
    <select id="start">
        <option>Sundarijal</option>
        <option>Mulkharka</option>
        <option>Manichud</option>
        <option>Chisapani</option>
        <option>Nagarkot</option>
        <option>Dhulikhel</option>
        <option>Dhap Dam</option>
        <option>Shivapuri Peak</option>
        <option>Nagi Gumba</option>
        <option>Jamacho</option>
        <option>Champadevi</option>
        <option>Phulchoki</option>
    </select>

    <label for="end">Destination</label>
    <select id="end">
        <option>Sundarijal</option>
        <option>Mulkharka</option>
        <option>Manichud</option>
        <option>Chisapani</option>
        <option>Nagarkot</option>
        <option>Dhulikhel</option>
        <option>Dhap Dam</option>
        <option>Shivapuri Peak</option>
        <option>Nagi Gumba</option>
        <option>Jamacho</option>
        <option>Champadevi</option>
        <option>Phulchoki</option>
    </select>

    <button onclick="findRoute()">Find Route</button>

    <h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
